<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM 对战可视化 · po-pokellmon</title>
<style>
:root{
  --bg:#070b12; --panel:#101a26; --panel2:#0d141f; --edge:rgba(120,170,220,.14);
  --text:#e8f0fa; --dim:#a8b8d0; --faint:#7c8ca5;
  --me:#38bdf8; --opp:#fb7185; --up:#f59e0b; --down:#60a5fa;
  --hp-hi:#4ade80; --hp-mid:#facc15; --hp-lo:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);font-size:15px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

.topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--edge);flex-wrap:wrap}
.topbar select{background:var(--panel2);color:var(--text);border:1px solid var(--edge);border-radius:6px;padding:6px 10px;font-size:15px;max-width:420px}
.topbar button{background:transparent;color:var(--dim);border:1px solid var(--edge);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:15px}
.topbar button:hover{color:var(--text);border-color:var(--me)}
.topbar .nav{display:flex;align-items:center;gap:8px}
.topbar .nav input[type=range]{width:200px}
.topbar .stepinfo{font-family:Consolas,monospace;color:var(--dim);font-size:14px;min-width:120px}
.topbar .tag{font-size:12px;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.05em}
.topbar .tag.notool{background:rgba(56,189,248,.15);color:var(--me)}
.topbar .tag.tool{background:rgba(245,158,11,.15);color:var(--up)}

.main{flex:1 1 auto;display:flex;gap:10px;padding:10px;min-height:0;overflow-x:auto}
.col-left{flex:0 0 27%;min-width:170px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto}
.col-left .panel{flex:0 0 auto}
.col-mid{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;min-width:240px}
.col-right{flex:0 0 31%;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;min-width:300px}

.panel{background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:10px;display:flex;flex-direction:column;min-height:0}
.panel h3{font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--faint);margin-bottom:8px;flex:0 0 auto}
.grow{flex:1 1 auto;min-height:130px;overflow-y:auto}
.llm-panel{flex:1 1 auto;min-height:0;overflow-y:auto}
#toolCalls{overflow-y:auto}

/* 对战卡 */
.poke{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;background:var(--panel2);margin-bottom:5px;flex-wrap:wrap}
.poke .name{font-weight:700;font-size:16px}
.poke .types{display:flex;gap:4px}
.tchip{font-size:12px;font-weight:700;color:#fff;padding:2px 6px;border-radius:3px;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.hpbar{flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden;min-width:40px}
.hpbar i{display:block;height:100%;border-radius:4px}
.pct{font-family:Consolas,monospace;font-weight:700;font-size:15px;min-width:40px;text-align:right}
.ko{opacity:.6;filter:grayscale(.5)}
.boost{font-family:Consolas,monospace;font-size:12px;font-weight:700;padding:1px 5px;border-radius:3px}
.boost.up{background:rgba(245,158,11,.18);color:var(--up)}
.boost.down{background:rgba(96,165,250,.18);color:var(--down)}
.moves{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.mv{font-size:12px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.25);display:inline-flex;align-items:center;gap:4px}
.mv .t{width:9px;height:9px;border-radius:50%;display:inline-block}
.mv .pp{color:var(--faint);font-family:Consolas,monospace}
.st{font-size:12px;font-weight:700;color:#fff;padding:2px 5px;border-radius:3px}
.row-label{font-size:12px;color:var(--faint);letter-spacing:.1em;margin:8px 0 4px;font-weight:700}

/* 战报 */
.hist{font-family:Consolas,"Microsoft YaHei",monospace;font-size:14px;line-height:1.6;white-space:pre-wrap;color:var(--dim)}
.hist .hl{color:var(--text)}

/* 完整 Prompt：自动换行（长行不横向滚动） */
#prompt{font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px;line-height:1.5;color:var(--dim);white-space:pre-wrap;word-break:break-all;margin:0}

/* LLM 交互 */
.llm .kv{display:flex;gap:8px;margin-bottom:5px;align-items:flex-start}
.llm .kv .k{flex:0 0 84px;color:var(--faint);font-size:12px;letter-spacing:.05em;padding-top:1px}
.llm .kv .v{flex:1;font-family:Consolas,monospace;font-size:14px;word-break:break-all}
.llm .kv .v.json{color:#a5d6ff}
.llm pre{font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px;line-height:1.5;color:var(--dim);white-space:pre-wrap;word-break:break-all;background:var(--panel2);border-radius:6px;padding:8px;max-height:200px;overflow-y:auto}
.toolcall{background:rgba(245,158,11,.06);border-left:2px solid var(--up);padding:6px 8px;border-radius:4px;margin-bottom:5px}
.toolcall .fn{color:var(--up);font-weight:700;font-size:14px}
.badge{font-size:12px;padding:1px 6px;border-radius:3px;font-weight:700}
.badge.fb{background:rgba(248,113,113,.2);color:#fca5a5}
.badge.ok{background:rgba(74,222,128,.15);color:#86efac}
.tokgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.tok{background:var(--panel2);border-radius:6px;padding:6px;text-align:center}
.tok .n{font-family:Consolas,monospace;font-size:18px;font-weight:700}
.tok .l{font-size:12px;color:var(--faint);margin-top:2px}

/* 实时进行中（LLM 思考中） */
#liveBox{border:1px dashed rgba(74,222,128,.35);border-radius:7px;padding:7px 8px;margin-bottom:8px;background:rgba(74,222,128,.05)}
#liveTimer{font-family:Consolas,monospace;font-weight:700;color:#86efac;font-size:16px}
#liveTools{max-height:150px;overflow-y:auto}
.toolcall.live{background:rgba(74,222,128,.06);border-left-color:#86efac;animation:liveIn .25s ease}
@keyframes liveIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="topbar">
  <select id="selBattle" onchange="loadBattle(this.value)"></select>
  <button id="btnLive" onclick="toggleLive()" style="border-color:rgba(74,222,128,.4);color:#86efac">LIVE 实时</button>
  <div class="nav">
    <button onclick="nav(-1)">◀ 上一条</button>
    <input type="range" id="slider" min="0" max="0" value="0" oninput="navTo(parseInt(this.value))">
    <button onclick="nav(1)">下一条 ▶</button>
  </div>
  <span class="stepinfo" id="stepInfo">-</span>
  <span class="tag notool" id="modeTag" style="display:none">NO-THINK</span>
  <span class="tag tool" id="toolTag" style="display:none">TOOL</span>
</div>

<div class="main">
  <div class="col-left">
    <div class="panel">
      <h3>对战界面 · 对手</h3>
      <div id="oppActive"></div>
      <div class="row-label">对手后备（已露）</div>
      <div id="oppBench"></div>
    </div>
    <div class="panel">
      <h3>对战界面 · 我方</h3>
      <div id="meActive"></div>
      <div class="row-label">我方队伍（含招式；倒下显示 KO）</div>
      <div id="meBench"></div>
    </div>
  </div>

  <div class="col-mid">
    <div class="panel grow" id="histPanel">
      <h3>历史战报（该决策时刻）</h3>
      <div class="hist" id="history"></div>
    </div>
    <div class="panel grow" id="promptPanel">
      <h3>完整 Prompt</h3>
      <pre id="prompt"></pre>
    </div>
  </div>

  <div class="col-right">
    <div class="panel llm-panel" id="llmPanel">
      <h3>LLM 交互（当前这条决策）</h3>
      <div id="liveBox" style="display:none">
        <div class="kv"><span class="k">实时</span><span class="v"><span id="liveTimer">0s</span> <span id="livePhase"></span></span></div>
        <div id="liveTools"></div>
      </div>
      <div class="llm" id="llmInfo"></div>
      <div class="tokgrid" id="tokGrid"></div>
      <div id="toolCalls"></div>
    </div>
  </div>
</div>

<script>
var TYPE_CN={Normal:"一般",Fire:"火",Water:"水",Electric:"电",Grass:"草",Ice:"冰",Fighting:"格斗",Poison:"毒",Ground:"地",Flying:"飞",Psychic:"超能",Bug:"虫",Rock:"岩",Ghost:"幽灵",Dragon:"龙",Dark:"恶",Steel:"钢",Fairy:"妖精"};
var TYPE_COLOR={Normal:"#A8A878",Fire:"#F08030",Water:"#6890F0",Electric:"#F8D030",Grass:"#78C850",Ice:"#98D8D8",Fighting:"#C03028",Poison:"#A040A0",Ground:"#E0C068",Flying:"#A890F0",Psychic:"#F85888",Bug:"#A8B820",Rock:"#B8A038",Ghost:"#705898",Dragon:"#7038F0",Dark:"#705848",Steel:"#B8B8D0",Fairy:"#EE99AC"};
var STATUS={burn:{cn:"烧",c:"#fb923c"},sleep:{cn:"睡",c:"#60a5fa"},freeze:{cn:"冰",c:"#67e8f9"},paralysis:{cn:"麻",c:"#fde047"},poison:{cn:"毒",c:"#a855f7"}};

var BATTLE=null, cur=0;
var SYS_PROMPT='';   // ?light=1 只在第一条里带 systemPrompt（每条都一样），其余用这条兜底

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function hpColor(p){return p>50?["#4ade80","#16a34a"]:p>25?["#facc15","#ca8a04"]:["#f87171","#dc2626"];}
function typeChip(t){ if(!t) return '<span class="tchip" style="background:#6b7280">?</span>'; return '<span class="tchip" style="background:'+(TYPE_COLOR[t]||'#6b7280')+'">'+(TYPE_CN[t]||t)+'</span>';}
function statusChip(s){ return s&&STATUS[s]?'<span class="st" style="background:'+STATUS[s].c+'">'+STATUS[s].cn+'</span>':''; }
function boostsHtml(arr){ if(!arr||!arr.length) return ''; return arr.map(function(b){ var up=b.indexOf('-')===-1; return '<span class="boost '+(up?'up':'down')+'">'+esc(b)+'</span>'; }).join(' '); }

function moveHtml(m){ // m 可能是 {name,type,pp} 或 {name,type}
  return '<span class="mv"><i class="t" style="background:'+(TYPE_COLOR[m.type]||'#6b7280')+'"></i>'+esc(m.name)+(m.pp!=null?'<span class="pp">'+m.pp+'</span>':'')+'</span>';
}

function hpBarHtml(pct){ var c=hpColor(pct); return '<div class="hpbar"><i style="width:'+pct+'%;background:'+c[0]+'"></i></div><span class="pct" style="color:'+c[0]+'">'+pct+'%</span>'; }

function renderActive(el, p, isMe){
  var hc=hpColor(p.hpPct||0);
  var nameColor=isMe?'#eaf6ff':'#ffeef1';
  var moves=(Array.isArray(p.moves)?p.moves:[]).map(moveHtml).join('');
  var boosts=boostsHtml(p.boosts);
  el.innerHTML='<div class="poke'+(p.hpPct===0?' ko':'')+'">'+
    '<span class="name" style="color:'+nameColor+'">'+esc(p.name||'?')+'</span>'+
    (p.types||[]).map(typeChip).join('')+
    statusChip(p.status)+
    hpBarHtml(p.hpPct||0)+
  '</div>'+
  (boosts?'<div style="margin-bottom:5px">'+boosts+'</div>':'')+
  (moves?'<div class="moves">'+moves+'</div>':'');
}

function renderBench(el, bench){
  if(!bench||!bench.length){ el.innerHTML='<div style="color:var(--faint);font-size:14px">无</div>'; return; }
  el.innerHTML=bench.map(function(b){
    return '<div class="poke'+(b.ko?' ko':'')+'">'+
      '<span class="name">'+esc(b.name)+'</span>'+
      (b.types||[]).map(typeChip).join('')+
      statusChip(b.status)+
      hpBarHtml(b.hpPct||0)+
    '</div>'+
    (b.moves&&b.moves.length?'<div class="moves" style="margin:-2px 0 5px 20px">'+b.moves.map(moveHtml).join('')+'</div>':'');
  }).join('');
}

// 我方队伍（槽位 1-5）：用 myTeam（含已倒下）保证倒下后不消失；招式/属性从 bench 按名字补齐
function renderMyTeam(el, st){
  var team=(st.myTeam||[]).slice(1);                 // slot 0 = 场上，已在 meActive 展示
  if(!team.length){ renderBench(el, st.bench||[]); return; }   // 兼容无 myTeam 的旧日志
  var byName={}; (st.bench||[]).forEach(function(b){ byName[b.name]=b; });
  el.innerHTML=team.map(function(p){
    if(p.ko) return '<div class="poke ko"><span class="name">'+esc(p.name)+'</span><span class="pct" style="color:var(--faint)">KO</span></div>';
    var b=byName[p.name]||{};
    return '<div class="poke"><span class="name">'+esc(p.name)+'</span>'+
      (b.types||[]).map(typeChip).join('')+
      statusChip(p.status)+
      hpBarHtml(p.hpPct||0)+
    '</div>'+
    (b.moves&&b.moves.length?'<div class="moves" style="margin:-2px 0 5px 20px">'+b.moves.map(moveHtml).join('')+'</div>':'');
  }).join('');
}

function renderBattle(st){
  if(!st){ return; }
  renderActive(document.getElementById('oppActive'), st.opp||{}, false);
  // 对手后备：用 oppTeam 展示详情（HP%/状态/KO/未亮相），跳过 slot 0（场上已在 oppActive 展示）
  var ob=document.getElementById('oppBench');
  var oppTeam=(st.oppTeam||[]).slice(1, 6);
  ob.innerHTML='<div style="color:var(--dim);font-size:14px;margin-bottom:4px">剩余 '+(st.oppRemaining!=null?st.oppRemaining:'?')+' 只</div>'+
    oppTeam.map(function(b){
      if(b.ko) return '<div class="poke ko"><span class="name">'+esc(b.name||'???')+'</span><span class="pct" style="color:var(--faint)">KO</span></div>';
      if(b.revealed) return '<div class="poke"><span class="name">'+esc(b.name)+'</span>'+statusChip(b.status)+hpBarHtml(b.hpPct||0)+'</div>';
      return '<div class="poke"><span class="name" style="color:var(--faint)">???</span></div>';
    }).join('');
  renderActive(document.getElementById('meActive'), st.me||{}, true);
  renderMyTeam(document.getElementById('meBench'), st);
}

function renderLLM(d){
  var info=document.getElementById('llmInfo');
  var act='—';
  if(d.action){
    if(d.action.type==='switch') act='换人 pokeSlot='+d.action.pokeSlot;
    else act='出招 attackSlot='+d.action.attackSlot;
    if(d.fallback) act+=' (fallback: '+d.action.reason+')';
  }
  var rounds=(d.rounds!=null)?(' · rounds='+d.rounds):'';
  info.innerHTML=
    '<div class="kv"><span class="k">决策</span><span class="v json">'+esc(act)+'</span></div>'+
    '<div class="kv"><span class="k">回复原文</span><span class="v json">'+esc(d.reply||'')+'</span></div>'+
    '<div class="kv"><span class="k">耗时</span><span class="v">'+(d.totalMs!=null?d.totalMs+' ms'+rounds:'—')+'</span></div>'+
    '<div class="kv"><span class="k">状态</span><span class="v">'+(d.fallback?'<span class="badge fb">FALLBACK</span>':'<span class="badge ok">OK</span>')+'</span></div>';

  var g=document.getElementById('tokGrid');
  var u=d.usage||{};
  var reason=(u.completion_tokens_details&&u.completion_tokens_details.reasoning_tokens)||0;
  g.innerHTML=
    '<div class="tok"><div class="n">'+(u.total_tokens||0)+'</div><div class="l">total</div></div>'+
    '<div class="tok"><div class="n">'+(u.prompt_tokens||0)+'</div><div class="l">prompt</div></div>'+
    '<div class="tok"><div class="n">'+(u.completion_tokens||0)+'</div><div class="l">completion</div></div>'+
    '<div class="tok"><div class="n">'+reason+'</div><div class="l">reasoning</div></div>'+
    '<div class="tok"><div class="n">'+(u.prompt_cache_hit_tokens||0)+'</div><div class="l">cached</div></div>';

  var tc=document.getElementById('toolCalls');
  if(d.toolLog&&d.toolLog.length){
    var html='<div class="row-label">Tool 调用</div>';
    d.toolLog.forEach(function(round){
      round.calls.forEach(function(c){
        html+='<div class="toolcall"><div class="fn">'+esc(c.name)+'</div>'+
          '<div style="font-size:12px;color:var(--dim)">args: '+esc(JSON.stringify(c.args))+'</div>'+
          '<div style="font-size:12px;color:var(--dim)">→ '+esc(JSON.stringify(c.result))+'</div></div>';
      });
    });
    tc.innerHTML=html;
  } else {
    tc.innerHTML='';
  }
}

function render(d){
  renderBattle(d.state);
  renderLLM(d);
  var h=document.getElementById('history');
  var hist=(d.state&&d.state.history)||[];
  h.innerHTML=hist.map(function(x){ return '<span class="hl">'+esc(x)+'</span>'; }).join('<br>');
  document.getElementById('prompt').textContent='[SYSTEM]\n'+(d.systemPrompt||SYS_PROMPT||'(未记录)')+'\n\n[USER]\n'+(d.prompt||'');
  document.getElementById('slider').value=cur;
  document.getElementById('stepInfo').textContent='第 '+(cur+1)+' / '+BATTLE.length+' 条 · turn '+(d.turn!=null?d.turn:'?');
}

function navTo(i){
  if(!BATTLE||!BATTLE.length) return;
  if(i<0)i=0; if(i>=BATTLE.length)i=BATTLE.length-1;
  cur=i; render(BATTLE[cur]);
}
function nav(delta){ navTo(cur+delta); }

function loadBattle(file){
  fetch('/api/battle?light=1&file='+encodeURIComponent(file)).then(function(r){return r.json();}).then(function(arr){
    BATTLE=arr;
    cur=0;
    SYS_PROMPT=(arr.length&&arr[0].systemPrompt)||SYS_PROMPT;   // light 模式只在第一条带 systemPrompt
    document.getElementById('slider').max=Math.max(0,arr.length-1);
    var hasTool=arr.some(function(d){return d.toolLog&&d.toolLog.length;});
    document.getElementById('toolTag').style.display=hasTool?'inline':'none';
    document.getElementById('modeTag').style.display=hasTool?'none':'inline';
    if(arr.length) render(arr[0]);
  });
}

// 初始化：加载 battle 列表（每 15s 自动刷新，新的日志文件会出现并被切过去）
// ⚠ 不要调小这个间隔：日志在网络盘上，列表要 stat 200+ 个文件；原来 4s 轮询而每次请求要几十秒 → 请求堆积、整个服务卡死。
//    真正"进行中"的回合是走 SSE（/events）实时进列表的，不依赖这个轮询。
var listBusy=false;
function loadBattleList(){
  if(listBusy) return;                       // 上一次还没回来就跳过这一轮，避免堆积
  listBusy=true;
  fetch('/api/battles').then(function(r){return r.json();}).then(function(list){
    var sel=document.getElementById('selBattle');
    var prev=sel.value;
    sel.innerHTML='';
    list.forEach(function(f){
      var o=document.createElement('option');
      o.value=f.file; o.textContent='['+(f.source==='tool'?'TOOL':'NO-THINK')+'] '+f.name+' ('+Math.round(f.bytes/1024)+'KB)';
      sel.appendChild(o);
    });
    if(list.length && !liveMode){
      var newest=list[0].file;
      if(newest!==prev){ sel.value=newest; loadBattle(newest); }
      else { sel.value=prev; }
    }
  }).catch(function(){}).then(function(){ listBusy=false; });
}
loadBattleList();
setInterval(loadBattleList, 15000);

// ===== 进行中面板：LLM 思考中（SSE progress 事件，含正计时）=====
var liveStartTs=0, liveTimerId=null, liveBid=null;
function liveTick(){
  if(!liveStartTs) return;
  var el=document.getElementById('liveTimer');
  if(el) el.textContent=Math.floor((Date.now()-liveStartTs)/1000)+'s';
}
function renderProgress(d){
  var box=document.getElementById('liveBox');
  if(!box) return;
  var bid=(d.battleId!=null)?String(d.battleId):'?';
  if(d.phase==='start'){
    liveBid=bid;
    liveStartTs=d.ts?Date.parse(d.ts):Date.now();
    if(liveTimerId) clearInterval(liveTimerId);
    document.getElementById('liveTools').innerHTML='';
    document.getElementById('livePhase').textContent='思考中… (turn '+(d.turn!=null?d.turn:'?')+')';
    box.style.display='block';
    liveTick();
    liveTimerId=setInterval(liveTick,100);
    return;
  }
  if(d.phase==='tool'){
    if(bid!==liveBid) return;   // 其他对战，忽略
    var html='';
    (d.calls||[]).forEach(function(c){
      html+='<div class="toolcall live"><div class="fn">'+esc(c.name)+'</div>'+
        '<div style="font-size:12px;color:var(--dim)">args: '+esc(JSON.stringify(c.args))+'</div></div>';
    });
    if(html){
      var lt=document.getElementById('liveTools');
      if(lt){ lt.insertAdjacentHTML('beforeend',html); lt.scrollTop=lt.scrollHeight; }
    }
    liveTick();
    return;
  }
}
function stopProgress(){
  if(liveTimerId){ clearInterval(liveTimerId); liveTimerId=null; }
  liveStartTs=0;
  var box=document.getElementById('liveBox');
  if(box) box.style.display='none';
  var lt=document.getElementById('liveTools');
  if(lt) lt.innerHTML='';
}

// ===== 实时模式：SSE 收 /events，边打边追加 =====
var liveMode=false, liveList=[], es=null;
function toggleLive(){
  if(liveMode){ stopLive(); return; }
  startLive();
}
function startLive(){
  liveMode=true;
  liveList=[];
  document.getElementById('btnLive').textContent='LIVE ● 收集中';
  document.getElementById('btnLive').style.color='#86efac';
  if(!window.EventSource){ return; }
  es=new EventSource('/events');
  es.onmessage=function(ev){
    var d; try{ d=JSON.parse(ev.data); }catch(e){ return; }
    if(d.type==='progress'){ renderProgress(d); return; }   // 思考中：走实时面板，不进回合列表
    stopProgress();                                          // 回合完成，停表
    var bid=(d.state&&d.state.battleId!=null)?d.state.battleId:'?';
    if(liveList.length){
      var lastBid=(liveList[0].state&&liveList[0].state.battleId!=null)?liveList[0].state.battleId:'?';
      if(lastBid!==bid) liveList=[];   // 新对战，重置累积
    }
    liveList.push(d);
    BATTLE=liveList;
    cur=liveList.length-1;
    render(d);
    document.getElementById('slider').max=Math.max(0,liveList.length-1);
    var hasTool=d.toolLog&&d.toolLog.length;
    document.getElementById('toolTag').style.display=hasTool?'inline':'none';
    document.getElementById('modeTag').style.display=hasTool?'none':'inline';
  };
}
function stopLive(){
  liveMode=false;
  if(es){ try{es.close();}catch(e){} es=null; }
  stopProgress();
  document.getElementById('btnLive').textContent='LIVE 实时';
  var sel=document.getElementById('selBattle');
  if(sel.value) loadBattle(sel.value);
}
</script>
</body>
</html>
